        condicion:
          type: [string, "null"]
          enum: [pendiente_decision_agente, operativa, esperando_observacion, publicacion_previa_desconocida, registro_no_operable, publicacion_bloqueada, publicacion_fallida, null]
        terminal:
          type: [string, "null"]
