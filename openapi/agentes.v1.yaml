openapi: 3.1.0
info:
  title: API de agentes Sentinelia
  version: 1.0.0
  summary: Contrato para agentes técnicos Sentinelia.
  description: >
    API máquina a máquina para agentes Sentinelia provisionados. Esta porción
    del contrato cubre login técnico, inspección de sesión viva, renovación de
    sesión efímera, pruebas de vida heartbeat/POL, configuración efectiva
    mínima, estado e intenciones DDNS e ingesta de catálogos y observaciones
    de telemetría. El secreto
    persistente solo se acepta en POST /api/agentes/v1/login. Todas las llamadas
    posteriores usan un token Bearer opaco de sesión, almacenado en servidor
    dentro de Redis con TTL. SQL conserva identidad persistente, scope, estado
    administrativo, estado de acceso, telemetría y fotografías diagnósticas,
    pero Redis es la única fuente de verdad para una sesión viva. El agente
    declara conectividad y hechos observados; las reglas de interpretación, los
    monitores, las alertas y las automatizaciones son responsabilidades internas
    de Sentinelia y no forman parte de este contrato técnico.
servers:
  - url: /
    description: Mismo origen que sirve este contrato OpenAPI.
tags:
  - name: Agentes
    description: >
      Endpoints de autenticación, coordinación, prueba de vida, configuración e
      ingesta de telemetría para agentes Sentinelia provisionados.
paths:
  /api/agentes/v1/login:
    post:
      tags:
        - Agentes
      operationId: loginAgenteSentineliaV1
      summary: Abre una sesión viva para un agente provisionado.
      description: >
        Autentica un agente ya provisionado usando su GUID estable y su secreto
        persistente. El secreto persistente solo debe viajar en este endpoint y
        nunca debe devolverse. Un login correcto reemplaza cualquier sesión viva
        anterior del mismo agente y abre el periodo de vida POL en SQL.
        loginRequestId es obligatorio e idempotente: la respuesta correcta lo
        devuelve en requestId para que el agente pueda reintentar la misma
        operación sin registrar ni persistir tokens en claro.
        sessionIdAnterior es opcional y diagnóstico: ayuda a trazar un relogin
        tras pausa, pérdida de Redis o reinicio del agente, pero nunca es una
        credencial.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentLoginRequest"
            examples:
              ordinaryLogin:
                summary: Login de un agente recién arrancado.
                value:
                  guid: "123e4567-e89b-42d3-a456-426614174000"
                  secreto: "sa_EXAMPLE_DO_NOT_USE_Fc8K2jS1xq9mYb7rPz4wTn"
                  loginRequestId: "01980000-0000-7000-8000-000000000101"
                  bootId: "7df18f4b-df99-4f6d-9d61-64a0c8f8b6e2"
                  hostname: "edge-node-01"
                  versionAgente: "1.0.0"
                  timestampClienteUtc: "2026-07-06T10:15:30Z"
              reloginAfterRedisLoss:
                summary: Relogin declarando el id de sesión anterior.
                value:
                  guid: "123e4567-e89b-42d3-a456-426614174000"
                  secreto: "sa_EXAMPLE_DO_NOT_USE_Fc8K2jS1xq9mYb7rPz4wTn"
                  loginRequestId: "01980000-0000-7000-8000-000000000102"
                  sessionIdAnterior: "ags_01K02WVK6KZ3M6HJH3VGM4R6WF"
                  bootId: "7df18f4b-df99-4f6d-9d61-64a0c8f8b6e2"
                  hostname: "edge-node-01"
                  versionAgente: "1.0.0"
      responses:
        "200":
          description: Agente autenticado y sesión viva abierta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentLoginResponse"
              examples:
                accepted:
                  summary: Login aceptado.
                  value:
                    ok: true
                    requestId: "01980000-0000-7000-8000-000000000101"
                    serverTimeUtc: "2026-07-06T10:15:31Z"
                    agente:
                      id: 126
                      guid: "123e4567-e89b-42d3-a456-426614174000"
                      nombre: "Agente edge-node-01"
                      tenantId: 55
                      empresaId: 20
                      sitioId: 11
                      estadoAdministrativo: "activo"
                      estadoAcceso: "normal"
                    sesion:
                      sessionId: "ags_01K02X1A6W8P4J9TXB2B7W1H91"
                      sessionToken: "sat_EXAMPLE_OPAQUE_SESSION_TOKEN"
                      expiresInSeconds: 900
                      renewBeforeSeconds: 120
                    pol:
                      estadoVidaPol: "vivo"
                      periodoId: 7801
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/LoginAuthenticationFailed"
        "403":
          $ref: "#/components/responses/LoginRefused"
        "409":
          $ref: "#/components/responses/LoginSuspiciousButAcceptedConflict"
        "410":
          $ref: "#/components/responses/SessionResponseGone"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/agentes/v1/me:
    get:
      tags:
        - Agentes
      operationId: getAgenteSentineliaMeV1
      summary: Devuelve la identidad y el estado de sesión viva del agente actual.
      description: >
        Valida el token Bearer de sesión contra Redis y devuelve la identidad,
        sesión y estado mínimos conocidos del agente actual. Este endpoint no
        devuelve configuración efectiva; eso corresponde a
        GET /api/agentes/v1/configuracion. Si Redis ya no conserva la sesión, o
        si la sesión fue reemplazada, la respuesta es 403 y el agente debe
        iniciar un nuevo login usando GUID y secreto persistente.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sesión viva encontrada y válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentMeResponse"
              examples:
                liveSession:
                  summary: Sesión viva actual.
                  value:
                    ok: true
                    requestId: "req_01K02X1B6W8P4J9TXB2B7W1H92"
                    serverTimeUtc: "2026-07-06T10:16:10Z"
                    agente:
                      id: 126
                      guid: "123e4567-e89b-42d3-a456-426614174000"
                      nombre: "Agente edge-node-01"
                      tenantId: 55
                      empresaId: 20
                      sitioId: 11
                      estadoAdministrativo: "activo"
                      estadoAcceso: "normal"
                    sesion:
                      sessionId: "ags_01K02X1A6W8P4J9TXB2B7W1H91"
                      expiresInSeconds: 861
                      renewBeforeSeconds: 120
                    pol:
                      estadoVidaPol: "vivo"
                      ultimoHeartbeatUtc: null
                      ultimoBootId: "7df18f4b-df99-4f6d-9d61-64a0c8f8b6e2"
                      ultimoSeq: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/SessionNotLive"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/agentes/v1/session/refresh:
    post:
      tags:
        - Agentes
      operationId: refreshSesionAgenteSentineliaV1
      summary: Renueva la sesión efímera actual del agente.
      description: >
        Renueva una sesión viva respaldada por Redis sin reenviar el secreto
        persistente del agente. El token Bearer es la credencial; sessionIdActual
        y bootId son guardas de coherencia para que instancias web concurrentes
        y agentes puedan detectar de forma explícita sesiones antiguas,
        reemplazadas o inconsistentes. Una renovación correcta invalida de forma
        atómica la sesión Redis anterior, emite un nuevo token Bearer opaco con
        TTL renovado y mantiene abierto el periodo de vida POL actual cuando la
        identidad de arranque es coherente. Si Redis ya no conserva la sesión,
        el agente debe hacer login de nuevo con GUID y secreto persistente.
        refreshRequestId es obligatorio e idempotente: la respuesta correcta lo
        devuelve en requestId y permite recuperar únicamente la repetición
        exacta autorizada por la misma operación.
        sessionIdActual debe coincidir con la sesión Redis representada por el
        token Bearer; bootId debe coincidir con el proceso vivo actual del agente
        salvo que el servidor fuerce deliberadamente un relogin.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentSessionRefreshRequest"
            examples:
              normalRefresh:
                summary: Renovación antes de agotar el TTL.
                value:
                  refreshRequestId: "01980000-0000-7000-8000-000000000201"
                  sessionIdActual: "ags_01K02X1A6W8P4J9TXB2B7W1H91"
                  bootId: "7df18f4b-df99-4f6d-9d61-64a0c8f8b6e2"
                  revisionConfiguracionConocida: "cfg_01K02X1C0Z"
                  revisionPoliticaConocida: "pol_01K02X1C0Z"
                  timestampClienteUtc: "2026-07-06T10:27:30Z"
      responses:
        "200":
          description: Sesión renovada y sesión efímera anterior reemplazada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSessionRefreshResponse"
              examples:
                refreshed:
                  summary: Nueva sesión efímera emitida.
                  value:
                    ok: true
                    requestId: "01980000-0000-7000-8000-000000000201"
                    serverTimeUtc: "2026-07-06T10:27:31Z"
                    agente:
                      id: 126
                      guid: "123e4567-e89b-42d3-a456-426614174000"
                      nombre: "Agente edge-node-01"
                      tenantId: 55
                      empresaId: 20
                      sitioId: 11
                      estadoAdministrativo: "activo"
                      estadoAcceso: "normal"
                    sesion:
                      sessionId: "ags_01K02X1D6W8P4J9TXB2B7W1H94"
                      sessionToken: "sat_EXAMPLE_REFRESHED_OPAQUE_SESSION_TOKEN"
                      previousSessionId: "ags_01K02X1A6W8P4J9TXB2B7W1H91"
                      expiresInSeconds: 900
                      renewBeforeSeconds: 120
                    coordinacion:
                      requiereConfiguracion: false
                      revisionConfiguracionActual: "cfg_01K02X1C0Z"
                      requierePolitica: false
                      revisionPoliticaActual: "pol_01K02X1C0Z"
                    pol:
                      estadoVidaPol: "vivo"
                      periodoId: 7801
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/SessionNotLive"
        "409":
          $ref: "#/components/responses/RefreshConflict"
        "410":
          $ref: "#/components/responses/SessionResponseGone"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/agentes/v1/heartbeat:
    post:
      tags:
        - Agentes
      operationId: heartbeatAgenteSentineliaV1
      summary: Confirma que el agente sigue vivo para la sesión actual.
      description: >
        Registra un heartbeat de prueba de vida para la sesión actual respaldada
        por Redis. El token Bearer sigue siendo la credencial viva. seq y bootId
        son guardas de coherencia: seq permite al servidor detectar heartbeats
        repetidos o antiguos, mientras que bootId debe coincidir con el proceso
        vivo actual representado por la sesión. timestampClienteUtc y
        uptimeSeconds son informativos; la hora del servidor es la autoridad para
        POL y estado operativo. Este endpoint no es, deliberadamente, un punto de
        ingesta de telemetría rica.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentHeartbeatRequest"
            examples:
              ordinaryHeartbeat:
                summary: Prueba de vida periódica desde un agente vivo.
                value:
                  seq: 42
                  bootId: "7df18f4b-df99-4f6d-9d61-64a0c8f8b6e2"
                  timestampClienteUtc: "2026-07-06T10:28:30Z"
                  uptimeSeconds: 780
      responses:
        "200":
          description: Heartbeat aceptado y estado POL actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHeartbeatResponse"
              examples:
                accepted:
                  summary: Heartbeat aceptado.
                  value:
                    ok: true
                    requestId: "req_01K02X1H6W8P4J9TXB2B7W1H95"
                    serverTimeUtc: "2026-07-06T10:28:31Z"
                    agente:
                      id: 126
                      guid: "123e4567-e89b-42d3-a456-426614174000"
                      nombre: "Agente edge-node-01"
                      tenantId: 55
                      empresaId: 20
                      sitioId: 11
                      estadoAdministrativo: "activo"
                      estadoAcceso: "normal"
                    sesion:
                      sessionId: "ags_01K02X1D6W8P4J9TXB2B7W1H94"
                      expiresInSeconds: 842
                      renewBeforeSeconds: 120
                    heartbeat:
                      seqAceptado: 42
                      recibidoEnUtc: "2026-07-06T10:28:31Z"
                      desfaseClienteMs: -1000
                    pol:
                      estadoVidaPol: "vivo"
                      periodoId: 7801
                      heartbeatsRecibidos: 12
                      ultimoSeq: 42
                    coordinacion:
                      accion: "continue"
                      requiereRefreshSesion: false
                      requiereConfiguracion: false
                      revisionConfiguracionActual: "cfg_01K02X1C0Z"
                      requierePolitica: false
                      revisionPoliticaActual: "pol_01K02X1C0Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/SessionNotLive"
        "409":
          $ref: "#/components/responses/HeartbeatConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/agentes/v1/configuracion:
    get:
      tags:
        - Agentes
      operationId: getConfiguracionEfectivaAgenteSentineliaV1
      summary: Devuelve la configuración efectiva mínima del agente actual.
      description: >
        Devuelve la fotografía estable de configuración que necesita un agente
        vivo para mantener su sesión, heartbeat y bucle de coordinación alineados
        con el servidor. El token Bearer sigue siendo la credencial viva y se
        valida contra Redis. Este endpoint expone deliberadamente solo política
        mínima y capacidades declaradas; no asigna trabajos, comandos, ingesta de
        telemetría rica ni tareas de runtime.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Fotografía de configuración efectiva devuelta para la sesión viva.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentEffectiveConfigurationResponse"
              examples:
                minimalConfiguration:
                  summary: Configuración efectiva mínima sin capacidades extra.
                  value:
                    ok: true
                    requestId: "req_01K02X1K6W8P4J9TXB2B7W1H96"
                    serverTimeUtc: "2026-07-06T10:29:00Z"
                    agente:
                      id: 126
                      guid: "123e4567-e89b-42d3-a456-426614174000"
                      nombre: "Agente edge-node-01"
                      tenantId: 55
                      empresaId: 20
                      sitioId: 11
                      estadoAdministrativo: "activo"
                      estadoAcceso: "normal"
                    sesion:
                      sessionId: "ags_01K02X1D6W8P4J9TXB2B7W1H94"
                      expiresInSeconds: 812
                      renewBeforeSeconds: 120
                    configuracion:
                      revisionConfiguracion: "cfg_01K02X1C0Z"
                      revisionPolitica: null
                      generadaEnUtc: "2026-07-06T10:29:00Z"
                      politicaVida:
                        heartbeatIntervalSeconds: 30
                        heartbeatGraceSeconds: 90
                        sessionTtlSeconds: 900
                        refreshBeforeSeconds: 120
                      capacidades:
                        - codigo: "heartbeat"
                          habilitada: true
                          descripcion: "Prueba de vida POL mínima."
                        - codigo: "session_refresh"
                          habilitada: true
                          descripcion: "Renovación de sesión efímera."
                        - codigo: "effective_configuration"
                          habilitada: true
                          descripcion: "Lectura de configuración efectiva mínima."
                        - codigo: "telemetry"
                          habilitada: false
                          descripcion: "Reservada para fases futuras."
                        - codigo: "commands"
                          habilitada: false
                          descripcion: "Reservada para fases futuras."
                        - codigo: "dynamic_dns"
                          habilitada: false
                          descripcion: "Reservada para fases futuras."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/SessionNotLive"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/agentes/v1/ddns:
    get:
      tags:
        - Agentes
      operationId: listarDdnsAgenteSentineliaV1
      summary: Devuelve la fotografía DDNS vigente del agente actual.
      description: >
        Consulta privada, paginada y sin caché de las concesiones DDNS vigentes
        que pertenecen al agente identificado exclusivamente por su sesión
        Bearer. No expone scopes humanos, identificadores SQL, histórico ni
        diagnósticos internos. El cursor es opaco y queda ligado al agente y al
        límite de la consulta que lo originó.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Tamaño de página; el servidor aplica 100 por defecto y 500 como máximo.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: cursor
          in: query
          required: false
          description: Continuación opaca devuelta por la página anterior.
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Fotografía DDNS privada del agente autenticado.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DdnsListResponse"
              examples:
                concesionObservada:
                  summary: Registro A esperando una observación POL posterior.
                  value:
                    ok: true
                    requestId: "req_01K5288C000000000000000001"
                    serverTimeUtc: "2026-09-09T08:00:00.000Z"
                    concesiones:
                      - concesionId: "01990000-0000-7000-8000-000000000801"
                        registro:
                          nombre: "router.example.net."
                          tipo: "A"
                        capacidades:
                          modos: ["observada", "declarada"]
                        version: "7"
                        decision: "operativa"
                        modo: "observada"
                        condicion: "esperando_observacion"
                        estadoDeseado: null
                        estadoPublicado:
                          tipo: "A"
                          modo: "declarada"
                          valor:
                            direccionIpv4: "192.0.2.20"
                        progreso:
                          hito: "intencion_aceptada"
                          terminal: null
                        intentos:
                          consumidos: 0
                          restantes: 3
                        diagnostico: "esperando_observacion"
                        timestamps:
                          concesionCreadaEnUtc: "2026-09-09T07:40:00.000Z"
                          actualizadaEnUtc: "2026-09-09T07:59:00.000Z"
                          intencionAceptadaEnUtc: "2026-09-09T07:59:00.000Z"
                          contenidoPersistidoEnUtc: null
                          contenidoPublicadoEnUtc: null
                          terminadaEnUtc: null
                    paginacion:
                      limite: 100
                      siguienteCursor: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/SessionNotLive"
  /api/agentes/v1/ddns/{concesionId}/intenciones:
    post:
      tags:
        - Agentes
      operationId: crearIntencionDdnsAgenteSentineliaV1
      summary: Declara el estado deseado de una concesión DDNS propia.
      description: >
        Acepta una decisión para un único registro. El agente se deriva solo de
        la sesión Bearer y el tipo se deriva del registro bloqueado por el
        servidor; ninguno de ambos puede elegirse en la ruta o el cuerpo.
        solicitudId aporta idempotencia durable y versionEsperada protege frente
        a decisiones concurrentes. Una aceptación 202 confirma intención
        durable, no publicación DNS ni propagación.
      security:
        - bearerAuth: []
      parameters:
        - name: concesionId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/DdnsUuidV7"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DdnsIntentionRequest"
            examples:
              ipv4Declarada:
                summary: Dirección IPv4 declarada por el agente.
                value:
                  solicitudId: "01990000-0000-7000-8000-000000000802"
                  versionEsperada: "7"
                  estadoDeseado:
                    modo: "declarada"
                    valor:
                      direccionIpv4: "203.0.113.8"
              ipv6Observada:
                summary: El siguiente POL IPv6 posterior aportará el contenido.
                value:
                  solicitudId: "01990000-0000-7000-8000-000000000803"
                  versionEsperada: "3"
                  estadoDeseado:
                    modo: "observada"
              cnameDeclarado:
                summary: Destino CNAME absoluto.
                value:
                  solicitudId: "01990000-0000-7000-8000-000000000804"
                  versionEsperada: "1"
                  estadoDeseado:
                    modo: "declarada"
                    valor:
                      destino: "origin.example.net."
              mxDeclarado:
                summary: Destino MX y prioridad.
                value:
                  solicitudId: "01990000-0000-7000-8000-000000000805"
                  versionEsperada: "2"
                  estadoDeseado:
                    modo: "declarada"
                    valor:
                      prioridad: 10
                      destino: "mail.example.net."
      responses:
        "202":
          description: Intención nueva aceptada durablemente; la publicación es posterior.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DdnsIntentionResponse"
              examples:
                accepted:
                  value:
                    ok: true
                    requestId: "req_01K5288C000000000000000002"
                    serverTimeUtc: "2026-09-09T08:01:00.000Z"
                    perfil: "ddns_agentes@1/resultado"
                    versionContrato: 1
                    resultado: "aceptada"
                    version: "8"
                    hito: "contenido_deseado_persistido"
                    condicion: "operativa"
                    terminal: null
                    error: null
                    estadoDeseado:
                      tipo: "A"
                      modo: "declarada"
                      valor:
                        direccionIpv4: "203.0.113.8"
        "200":
          description: Repetición exacta, convergencia o ausencia de cambios.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DdnsIntentionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/SessionNotLive"
        "404":
          description: Concesión inexistente, ajena, no concedida o revocada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                noAuthority:
                  value:
                    ok: false
                    requestId: "req_01K5288CERR404"
                    code: "sin_autoridad"
                    message: "La concesión DDNS no está disponible."
        "409":
          description: Versión obsoleta, idempotencia conflictiva o registro no operable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                staleVersion:
                  value:
                    ok: false
                    requestId: "req_01K5288CERR409"
                    code: "version_obsoleta"
                    message: "La versión DDNS esperada ya no gobierna."
                    currentVersion: "8"
        "422":
          description: El estado declarado no es interpretable para el tipo real del registro.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidValue:
                  value:
                    ok: false
                    requestId: "req_01K5288CERR422"
                    code: "valor_no_interpretable"
                    message: "El estado DDNS deseado no es interpretable."
  /api/agentes/v1/telemetria:
    post:
      tags:
        - Agentes
      operationId: ingerirTelemetriaAgenteSentineliaV1
      summary: Recibe observaciones de telemetría del agente actual.
      description: >
        Recibe un lote de observaciones emitidas por un agente con sesión viva.
        La credencial válida es exclusivamente el token Bearer efímero respaldado
        por Redis; este endpoint no acepta el secreto persistente del agente ni
        debe usarse como login técnico. La hora de recepción es generada por
        Sentinelia en UTC. `telemetriaRequestId` identifica de forma durable el
        contenido lógico del lote: repetir la misma identidad y contenido
        recupera el resultado estable original sin duplicar efectos; reutilizar
        la identidad con otro contenido devuelve 409. Una forma, tipo o valor
        inválido rechaza globalmente la petición con 400. El resultado parcial
        queda reservado a conflictos de catálogo ya consolidado, que se devuelven
        con el índice y motivo de la observación afectada. Una respuesta 200
        confirma exclusivamente el resultado de la ingesta; no confirma que una
        regla de interpretación haya coincidido, que un monitor haya cambiado de
        estado ni que se haya generado una alerta o ejecutado una automatización.
        Tras confirmar la persistencia, las observaciones actuales aptas pueden
        programar evaluaciones asíncronas de las reglas configuradas en el
        servidor. Este procesamiento posterior no amplía ni retrasa la respuesta
        contractual de la ingesta. Las observaciones diferidas se conservan como
        evidencia histórica y no reescriben retroactivamente el estado operativo
        vigente de reglas o monitores.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelemetryBatchRequest"
            examples:
              metricaNumerica:
                summary: Métrica numérica viva.
                description: Lectura actual de uso de CPU expresada como observación numérica.
                value:
                  telemetriaRequestId: "01a03b1e-32c8-7268-a531-84d68648b99b"
                  observaciones:
                    - categoria: "sistema"
                      clave: "cpu.uso"
                      tag: "socket0"
                      tipoDato: "numero"
                      unidad: "%"
                      observadoEnUtc: "2026-07-07T10:15:30Z"
                      valorNumero: 72.4
                      calidad: "valida"
                      severidadDeclarada: "info"
                      origen: "directa"
              estadoDiscreto:
                summary: Estado discreto vivo.
                description: Estado operativo de una puerta informado como observación discreta.
                value:
                  telemetriaRequestId: "01a03b1e-32c9-713b-ae60-6cd4a503eda8"
                  observaciones:
                    - categoria: "seguridad"
                      clave: "puerta.estado"
                      tag: "camara-01"
                      tipoDato: "estado"
                      observadoEnUtc: "2026-07-07T10:16:00Z"
                      valorEstado: "cerrada"
                      calidad: "valida"
                      severidadDeclarada: "info"
                      origen: "directa"
                      vigenteHastaUtc: "2026-07-07T10:21:00Z"
              observacionesDiferidas:
                summary: Observaciones pasadas recuperadas tras desconexión.
                description: Lote diferido con hora de emisión explícita del agente.
                value:
                  telemetriaRequestId: "01a03b1e-32c9-713b-ae60-72d709edc4cd"
                  emitidoEnUtc: "2026-07-07T10:30:00Z"
                  observaciones:
                    - categoria: "energia"
                      clave: "voltaje"
                      tag: "linea-a"
                      tipoDato: "numero"
                      unidad: "V"
                      observadoEnUtc: "2026-07-07T10:10:00Z"
                      valorNumero: 229.8
                      calidad: "valida"
                      severidadDeclarada: "info"
                      origen: "reenviada"
                    - categoria: "energia"
                      clave: "voltaje"
                      tag: "linea-a"
                      tipoDato: "numero"
                      unidad: "V"
                      observadoEnUtc: "2026-07-07T10:20:00Z"
                      valorNumero: 231.1
                      calidad: "valida"
                      severidadDeclarada: "info"
                      origen: "reenviada"
              detalleHumano:
                summary: Observación con detalle humano.
                description: Métrica legible por máquina acompañada de contexto útil para el operador.
                value:
                  telemetriaRequestId: "01a03b1e-32c9-713b-ae60-75401ca306ae"
                  observaciones:
                    - categoria: "sistema"
                      clave: "ram.uso"
                      tipoDato: "numero"
                      unidad: "%"
                      observadoEnUtc: "2026-07-07T10:17:15Z"
                      valorNumero: 44
                      calidad: "valida"
                      severidadDeclarada: "info"
                      origen: "directa"
                      detalleHumano: "4,4 GB usados de 10 GB visibles por el agente."
                      metadatos:
                        usadoGb: 4.4
                        totalGb: 10
                        origenLectura: "sistema_operativo"
              catalogoDeclarado:
                summary: Catálogo declarado junto a observaciones.
                description: El agente anticipa señales conocidas y envía lecturas en el mismo lote.
                value:
                  telemetriaRequestId: "01a03b1e-32c9-713b-ae60-78e5286ec47c"
                  catalogo:
                    revision: "cat_20260707_001"
                    senales:
                      - categoria: "sistema"
                        clave: "cpu.uso"
                        tag: "socket0"
                        tipoDato: "numero"
                        unidad: "%"
                        nombreHumano: "Uso de CPU socket 0"
                        descripcion: "Porcentaje de uso del primer socket de CPU visible por el agente."
                      - categoria: "ambiente"
                        clave: "temperatura"
                        tag: "camara-frigorifica"
                        tipoDato: "numero"
                        unidad: "ºC"
                        nombreHumano: "Temperatura de cámara frigorífica"
                        descripcion: "Lectura principal del sensor de cámara."
                  observaciones:
                    - categoria: "ambiente"
                      clave: "temperatura"
                      tag: "camara-frigorifica"
                      tipoDato: "numero"
                      unidad: "ºC"
                      observadoEnUtc: "2026-07-07T10:18:00Z"
                      valorNumero: 3.6
                      calidad: "valida"
                      severidadDeclarada: "info"
                      origen: "directa"
              datosTemporales:
                summary: Duración y momento UTC estrictos.
                description: Una duración en segundos y el instante UTC de la siguiente tarea.
                value:
                  telemetriaRequestId: "01a03b1e-32c9-713b-ae60-7c85a0deca05"
                  observaciones:
                    - categoria: "copias"
                      clave: "ultima_duracion"
                      tag: "principal"
                      tipoDato: "duracion"
                      unidad: "s"
                      observadoEnUtc: "2026-07-07T10:18:00Z"
                      valorDuracion: 1683.8219
                      calidad: "valida"
                      severidadDeclarada: "info"
                      origen: "directa"
                    - categoria: "copias"
                      clave: "proxima_ejecucion"
                      tag: "principal"
                      tipoDato: "momento_utc"
                      observadoEnUtc: "2026-07-07T10:18:00Z"
                      valorMomentoUtc: "2026-07-08T02:30:00Z"
                      calidad: "valida"
                      severidadDeclarada: "info"
                      origen: "directa"
      responses:
        "200":
          description: >
            Ingesta finalizada; solo los conflictos con un catálogo consolidado
            pueden producir observaciones aceptadas y rechazadas en el mismo lote.
            La aceptación no representa el resultado posterior de
            reglas de interpretación, monitores, alertas o automatizaciones.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryIngestionResponse"
              examples:
                aceptacionTotal:
                  summary: Lote aceptado completo.
                  value:
                    ok: true
                    resultado: "aceptado"
                    requestId: "req_01K02XTLMOK"
                    telemetriaRequestId: "01a03b1e-32c9-713b-ae60-78e5286ec47c"
                    serverTimeUtc: "2026-07-07T10:18:01Z"
                    recibidoEnUtc: "2026-07-07T10:18:01Z"
                    aceptadas: 1
                    rechazadas: 0
                    errores: []
                    coordinacion:
                      accion: "continue"
                      requiereRefreshSesion: false
                      requiereConfiguracion: false
                      revisionConfiguracionActual: "cfg_01K02X1C0Z"
                      requierePolitica: false
                      revisionPoliticaActual: "pol_01K02X1C0Z"
                aceptacionParcial:
                  summary: Lote aceptado parcialmente.
                  description: Una observación se acepta y otra se rechaza por conflicto semántico de unidad.
                  value:
                    ok: false
                    resultado: "parcial"
                    requestId: "req_01K02XTLMPART"
                    telemetriaRequestId: "01a03b1e-32c9-713b-ae60-828d13c29e84"
                    serverTimeUtc: "2026-07-07T10:19:00Z"
                    recibidoEnUtc: "2026-07-07T10:19:00Z"
                    aceptadas: 1
                    rechazadas: 1
                    errores:
                      - indice: 1
                        code: "senal_catalogo_incompatible"
                        message: "La señal de telemetría ya existe con tipo de dato o unidad distinta."
                        campo: "observaciones.1.definicionSenal"
                    coordinacion:
                      accion: "continue"
                      requiereRefreshSesion: false
                      requiereConfiguracion: false
                      revisionConfiguracionActual: "cfg_01K02X1C0Z"
                      requierePolitica: false
                      revisionPoliticaActual: "pol_01K02X1C0Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/SessionNotLive"
        "409":
          $ref: "#/components/responses/TelemetryIdempotencyConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/TelemetryInfrastructureFailure"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >
        Token de sesión opaco y revocable emitido por
        POST /api/agentes/v1/login y almacenado en servidor dentro de Redis con
        TTL. No es un contrato JWT y no debe confundirse con el secreto
        persistente del agente.
  responses:
    BadRequest:
      description: JSON mal formado, petición sintácticamente inválida o request id técnico ausente.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            malformed:
              value:
                ok: false
                requestId: "req_01K02XERR400"
                code: "peticion_invalida"
                message: "El cuerpo de la petición no es JSON válido."
            requestIdSesionRequerido:
              value:
                ok: false
                requestId: "req_01K02XERR400R"
                code: "REQUEST_ID_SESION_REQUERIDO"
                message: "loginRequestId o refreshRequestId es obligatorio para esta operación."
    LoginAuthenticationFailed:
      description: GUID o secreto persistente inválido.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            invalidCredentials:
              value:
                ok: false
                requestId: "req_01K02XERR401"
                code: "credenciales_invalidas"
                message: "Las credenciales del agente no son válidas."
    LoginRefused:
      description: El agente existe, pero su estado actual no permite login.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            disabled:
              value:
                ok: false
                requestId: "req_01K02XERR403"
                code: "agente_deshabilitado"
                message: "El agente está deshabilitado."
            quarantine:
              value:
                ok: false
                requestId: "req_01K02XERR403Q"
                code: "agente_en_cuarentena"
                message: "El agente está temporalmente en cuarentena."
                cuarentenaHastaUtc: "2026-07-06T10:30:31Z"
    LoginSuspiciousButAcceptedConflict:
      description: >
        El login no puede consolidarse porque otra operación está cambiando en
        este momento la sesión viva del mismo agente, o porque la implementación
        detecta una condición de reemplazo conflictiva.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            loginInProgress:
              value:
                ok: false
                requestId: "req_01K02XERR409L"
                code: "login_en_progreso"
                message: "Ya hay otro login técnico en curso para este agente."
                action: "login_again"
            replaced:
              value:
                ok: false
                requestId: "req_01K02XERR409"
                code: "sesion_reemplazada_concurrentemente"
                message: "Otro login reemplazó la sesión de forma concurrente."
                action: "login_again"
    Unauthorized:
      description: Token Bearer ausente, mal formado o no verificable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            missingBearer:
              value:
                ok: false
                requestId: "req_01K02XERR401B"
                code: "bearer_requerido"
                message: "Se requiere token Bearer de autorización."
                action: "login_required"
    SessionNotLive:
      description: El token de sesión está bien formado, pero ya no representa una sesión Redis viva.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            expiredInRedis:
              value:
                ok: false
                requestId: "req_01K02XERR403S"
                code: "sesion_no_vigente"
                message: "La sesión viva ya no está disponible."
                action: "login_required"
            replaced:
              value:
                ok: false
                requestId: "req_01K02XERR403R"
                code: "sesion_no_vigente"
                message: "La sesión viva fue reemplazada por otro login."
                action: "login_required"
    Conflict:
      description: La sesión y el estado del agente son inconsistentes.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            inconsistentState:
              value:
                ok: false
                requestId: "req_01K02XERR409C"
                code: "estado_inconsistente_relogin_requerido"
                message: "El estado del agente es inconsistente con la sesión actual."
                action: "login_required"
    TelemetryIdempotencyConflict:
      description: La identidad durable ya está asociada a otro contenido lógico.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            divergentContent:
              value:
                ok: false
                requestId: "req_01K02XERR409T"
                code: "telemetria_request_id_divergente"
                message: "telemetriaRequestId ya fue utilizado para un lote lógico diferente."
    TelemetryInfrastructureFailure:
      description: >
        La transacción durable no pudo completarse. La respuesta permanece
        estable y redactada; el agente puede reintentar conservando la misma
        identidad y el mismo contenido lógico.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            transactionFailed:
              value:
                ok: false
                requestId: "req_01K02XERR500T"
                code: "error_interno_telemetria"
                message: "No se pudo completar la ingesta de telemetría."
    RefreshConflict:
      description: La petición de renovación entra en conflicto con la sesión viva actual.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            staleSessionId:
              value:
                ok: false
                requestId: "req_01K02XERR409R"
                code: "session_id_actual_no_coincide"
                message: "El id de sesión actual no coincide con la sesión Bearer."
                action: "login_required"
            incoherentBoot:
              value:
                ok: false
                requestId: "req_01K02XERR409B"
                code: "boot_id_incoherente"
                message: "El bootId del agente es inconsistente con la sesión viva."
                action: "login_required"
            concurrentRefresh:
              value:
                ok: false
                requestId: "req_01K02XERR409F"
                code: "refresh_concurrente"
                message: "Otra renovación reemplazó esta sesión de forma concurrente."
                action: "login_required"
    SessionResponseGone:
      description: >
        La operación autenticada llegó a un estado donde la respuesta técnica ya
        no puede recuperarse de forma segura. El agente debe abrir una sesión
        nueva con otro request id estable según corresponda.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            responseGone:
              value:
                ok: false
                requestId: "01980000-0000-7000-8000-000000000201"
                code: "RESPUESTA_SESION_NO_RECUPERABLE"
                message: "La respuesta de sesión técnica ya no es recuperable."
                action: "login_required"
    HeartbeatConflict:
      description: La petición de heartbeat entra en conflicto con la sesión viva actual o el estado POL.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            incoherentBoot:
              value:
                ok: false
                requestId: "req_01K02XERR409H"
                code: "boot_id_incoherente"
                message: "El bootId del agente es inconsistente con la sesión viva."
                action: "login_required"
            oldSequence:
              value:
                ok: false
                requestId: "req_01K02XERR409Q"
                code: "heartbeat_seq_antiguo"
                message: "La secuencia de heartbeat es anterior al último heartbeat aceptado."
                action: "continue"
            inconsistentPol:
              value:
                ok: false
                requestId: "req_01K02XERR409P"
                code: "estado_inconsistente_relogin_requerido"
                message: "El estado POL del agente es inconsistente con la sesión actual."
                action: "login_required"
    UnprocessableEntity:
      description: La petición es sintácticamente válida, pero incumple validación de dominio.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
  schemas:
    DdnsUuidV7:
      type: string
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    DdnsDecimalUint64:
      type: string
      pattern: "^(0|[1-9][0-9]*)$"
      description: Decimal canónico de BIGINT UNSIGNED; nunca se transporta como número JSON.
    DdnsIntentionRequest:
      type: object
      additionalProperties: false
      required:
        - solicitudId
        - versionEsperada
        - estadoDeseado
      properties:
        solicitudId:
          $ref: "#/components/schemas/DdnsUuidV7"
        versionEsperada:
          $ref: "#/components/schemas/DdnsDecimalUint64"
        estadoDeseado:
          oneOf:
            - $ref: "#/components/schemas/DdnsObservedRequestState"
            - $ref: "#/components/schemas/DdnsDeclaredARequestState"
            - $ref: "#/components/schemas/DdnsDeclaredAaaaRequestState"
            - $ref: "#/components/schemas/DdnsDeclaredCnameRequestState"
            - $ref: "#/components/schemas/DdnsDeclaredMxRequestState"
    DdnsObservedRequestState:
      type: object
      additionalProperties: false
      required:
        - modo
      properties:
        modo:
          const: observada
    DdnsDeclaredARequestState:
      type: object
      additionalProperties: false
      required:
        - modo
        - valor
      properties:
        modo:
          const: declarada
        valor:
          $ref: "#/components/schemas/DdnsAValue"
    DdnsDeclaredAaaaRequestState:
      type: object
      additionalProperties: false
      required:
        - modo
        - valor
      properties:
        modo:
          const: declarada
        valor:
          $ref: "#/components/schemas/DdnsAaaaValue"
    DdnsDeclaredCnameRequestState:
      type: object
      additionalProperties: false
      required:
        - modo
        - valor
      properties:
        modo:
          const: declarada
        valor:
          $ref: "#/components/schemas/DdnsCnameValue"
    DdnsDeclaredMxRequestState:
      type: object
      additionalProperties: false
      required:
        - modo
        - valor
      properties:
        modo:
          const: declarada
        valor:
          $ref: "#/components/schemas/DdnsMxValue"
    DdnsAValue:
      type: object
      additionalProperties: false
      required:
        - direccionIpv4
      properties:
        direccionIpv4:
          type: string
          format: ipv4
    DdnsAaaaValue:
      type: object
      additionalProperties: false
      required:
        - direccionIpv6
      properties:
        direccionIpv6:
          type: string
          format: ipv6
    DdnsCnameValue:
      type: object
      additionalProperties: false
      required:
        - destino
      properties:
        destino:
          type: string
          minLength: 2
          maxLength: 254
          description: Nombre DNS absoluto ASCII o punycode, canonicalizado en minúsculas y con punto final.
    DdnsMxValue:
      type: object
      additionalProperties: false
      required:
        - prioridad
        - destino
      properties:
        prioridad:
          type: integer
          minimum: 0
          maximum: 65535
        destino:
          type: string
          minLength: 1
          maxLength: 254
          description: Nombre DNS absoluto; prioridad 0 y raíz representan exclusivamente Null MX.
    DdnsDesiredState:
      oneOf:
        - $ref: "#/components/schemas/DdnsAState"
        - $ref: "#/components/schemas/DdnsAaaaState"
        - $ref: "#/components/schemas/DdnsCnameState"
        - $ref: "#/components/schemas/DdnsMxState"
      discriminator:
        propertyName: tipo
        mapping:
          A: "#/components/schemas/DdnsAState"
          AAAA: "#/components/schemas/DdnsAaaaState"
          CNAME: "#/components/schemas/DdnsCnameState"
          MX: "#/components/schemas/DdnsMxState"
    DdnsAState:
      oneOf:
        - type: object
          additionalProperties: false
          required: [tipo, modo, valor]
          properties:
            tipo: { const: A }
            modo: { const: observada }
            valor:
              oneOf:
                - $ref: "#/components/schemas/DdnsAValue"
                - type: "null"
        - type: object
          additionalProperties: false
          required: [tipo, modo, valor]
          properties:
            tipo: { const: A }
            modo: { const: declarada }
            valor: { $ref: "#/components/schemas/DdnsAValue" }
    DdnsAaaaState:
      oneOf:
        - type: object
          additionalProperties: false
          required: [tipo, modo, valor]
          properties:
            tipo: { const: AAAA }
            modo: { const: observada }
            valor:
              oneOf:
                - $ref: "#/components/schemas/DdnsAaaaValue"
                - type: "null"
        - type: object
          additionalProperties: false
          required: [tipo, modo, valor]
          properties:
            tipo: { const: AAAA }
            modo: { const: declarada }
            valor: { $ref: "#/components/schemas/DdnsAaaaValue" }
    DdnsCnameState:
      type: object
      additionalProperties: false
      required: [tipo, modo, valor]
      properties:
        tipo: { const: CNAME }
        modo: { const: declarada }
        valor: { $ref: "#/components/schemas/DdnsCnameValue" }
    DdnsMxState:
      type: object
      additionalProperties: false
      required: [tipo, modo, valor]
      properties:
        tipo: { const: MX }
        modo: { const: declarada }
        valor: { $ref: "#/components/schemas/DdnsMxValue" }
    DdnsNullableDesiredState:
      oneOf:
        - $ref: "#/components/schemas/DdnsDesiredState"
        - type: "null"
    DdnsIntentionResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - requestId
        - serverTimeUtc
        - perfil
        - versionContrato
        - resultado
        - version
        - hito
        - condicion
        - terminal
        - error
        - estadoDeseado
      properties:
        ok: { const: true }
        requestId: { type: string }
        serverTimeUtc: { type: string, format: date-time }
