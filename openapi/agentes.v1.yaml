    TelemetryBatchRequest:
      type: object
      additionalProperties: false
      required:
        - telemetriaRequestId
        - observaciones
      description: >
        Lote de telemetría emitido por un agente con sesión técnica viva. La
        hora de recepción la genera Sentinelia en UTC y no se acepta desde el
        cliente. `emitidoEnUtc` es obligatorio cuando el lote contiene
        observaciones diferidas o recuperadas tras una desconexión, y opcional
        para observaciones vivas actuales. Cuando no se declara `emitidoEnUtc`,
        una observación se considera diferida si `observadoEnUtc` queda más de
        300 segundos por detrás de la recepción del servidor. La clasificación
        como diferida permite conservar la lectura en el histórico, pero impide
        que modifique retroactivamente el resultado operativo vigente.
      properties:
        telemetriaRequestId:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
          description: >
            UUIDv7 generado por el agente para identificar durablemente este
            contenido lógico. Debe conservarse al reintentar una petición cuya
            respuesta no llegó y no puede reutilizarse para otro contenido.
        emitidoEnUtc:
          type:
            - string
            - "null"
          format: date-time
          description: Hora UTC en la que el agente emite el lote completo.
        revisionConfiguracionConocida:
          type:
            - string
            - "null"
          maxLength: 120
          description: Revisión de configuración efectiva que el agente cree tener aplicada.
        revisionPoliticaConocida:
          type:
            - string
            - "null"
          maxLength: 120
          description: Revisión de política que el agente cree tener aplicada.
        catalogo:
          $ref: "#/components/schemas/TelemetrySignalCatalog"
        observaciones:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/TelemetryObservation"
    TelemetrySignalCatalog:
      type: object
      additionalProperties: false
      description: >
        Catálogo declarado por el agente para anticipar señales conocidas. No
        sustituye a las observaciones: ayuda a consolidar identidad, tipo y
        metadatos antes o durante la ingesta. Declarar una señal no crea reglas
        de interpretación, monitores, alertas ni automatizaciones; esas
        relaciones se administran exclusivamente en Sentinelia.
      required:
        - senales
      properties:
        revision:
          type:
            - string
            - "null"
          maxLength: 120
          description: Revisión opaca del catálogo conocida por el agente.
        senales:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/TelemetrySignalDefinition"
    TelemetrySignalDefinition:
      type: object
      additionalProperties: false
      required:
        - categoria
        - clave
        - tipoDato
      description: >
        Definición explícita de una señal. La identidad de dominio es
        `categoria` + `clave` + `tag` opcional. Una vez consolidada con
        `tipoDato` o `unidad`, un cambio incompatible debe rechazarse en vez de
        reinterpretar la serie histórica.
      allOf:
        - if:
            properties:
              tipoDato:
                const: duracion
            required:
              - tipoDato
          then:
            properties:
              unidad:
                enum:
                  - null
                  - ""
                  - s
        - if:
            properties:
              tipoDato:
                const: momento_utc
            required:
              - tipoDato
          then:
            properties:
              unidad:
                enum:
                  - null
                  - ""
      properties:
        categoria:
          type: string
          minLength: 1
          maxLength: 64
          description: Familia funcional de la señal, por ejemplo sistema, clima o proceso.
        clave:
          type: string
          minLength: 1
          maxLength: 128
          description: Magnitud o hecho observado dentro de la categoría.
        tag:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 128
          description: Diferenciador opcional dentro de la misma clave, por ejemplo socket0.
        tipoDato:
          $ref: "#/components/schemas/TelemetryDataType"
        unidad:
          type:
            - string
            - "null"
          maxLength: 32
          description: >
            Identificador declarado de unidad. No implica conversión automática
            ni equivalencia semántica entre unidades.
        nombreHumano:
          type:
            - string
            - "null"
          maxLength: 128
          description: Nombre legible para operadores.
        descripcion:
          type:
            - string
            - "null"
          maxLength: 512
          description: Contexto humano de la señal.
        metadatos:
          type:
            - object
            - "null"
          description: JSON auxiliar. Su representación estable serializada queda limitada a 2048 caracteres.
    TelemetrySignal:
      type: object
      additionalProperties: false
      required:
        - categoria
        - clave
        - tipoDato
      description: Señal ya conocida por Sentinelia con identidad semántica consolidada o en preparación.
      properties:
        categoria:
          type: string
          minLength: 1
          maxLength: 64
        clave:
          type: string
          minLength: 1
          maxLength: 128
        tag:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 128
        tipoDato:
          $ref: "#/components/schemas/TelemetryDataType"
        unidad:
          type:
            - string
            - "null"
          maxLength: 32
        nombreHumano:
          type:
            - string
            - "null"
          maxLength: 128
        descripcion:
          type:
            - string
            - "null"
          maxLength: 512
        metadatos:
          type:
            - object
            - "null"
          description: JSON auxiliar. Su representación estable serializada queda limitada a 2048 caracteres.
        codigoSenal:
          type: string
          readOnly: true
          description: Código visual derivado de categoria, clave y tag; no es la identidad persistente.
        consolidadaEnUtc:
          type:
            - string
            - "null"
          format: date-time
          readOnly: true
          description: Momento UTC en el que Sentinelia consolidó la definición de la señal.
    TelemetryObservation:
      type: object
      additionalProperties: false
      required:
        - categoria
        - clave
        - tipoDato
        - observadoEnUtc
      description: >
        Unidad base de telemetría. Una métrica, un estado discreto o una lectura
        textual se expresan como observaciones con distinto `tipoDato`; no son
        entidades paralelas obligatorias. Debe enviarse un único campo de valor
        coherente con `tipoDato`. El agente describe el hecho observado y su
        contexto; no declara en esta petición si el sistema debe considerarlo
        normal, anómalo o merecedor de una alerta.
      oneOf:
        - title: Valor numérico
          required:
            - tipoDato
            - valorNumero
          properties:
            tipoDato:
              const: numero
            valorNumero:
              type: number
            valorBooleano:
              type: "null"
            valorTexto:
              type: "null"
            valorEstado:
              type: "null"
            valorJson:
              type: "null"
            valorDuracion:
              type: "null"
            valorMomentoUtc:
              type: "null"
        - title: Valor booleano
          required:
            - tipoDato
            - valorBooleano
          properties:
            tipoDato:
              const: booleano
            valorNumero:
              type: "null"
            valorBooleano:
              type: boolean
            valorTexto:
              type: "null"
            valorEstado:
              type: "null"
            valorJson:
              type: "null"
            valorDuracion:
              type: "null"
            valorMomentoUtc:
              type: "null"
        - title: Valor textual
          required:
            - tipoDato
            - valorTexto
          properties:
            tipoDato:
              const: texto
            valorNumero:
              type: "null"
            valorBooleano:
              type: "null"
            valorTexto:
              type: string
              minLength: 1
              maxLength: 2048
            valorEstado:
              type: "null"
            valorJson:
              type: "null"
            valorDuracion:
              type: "null"
            valorMomentoUtc:
              type: "null"
        - title: Valor de estado
          required:
            - tipoDato
            - valorEstado
          properties:
            tipoDato:
              const: estado
            valorNumero:
              type: "null"
            valorBooleano:
              type: "null"
            valorTexto:
              type: "null"
            valorEstado:
              type: string
              minLength: 1
              maxLength: 128
            valorJson:
              type: "null"
            valorDuracion:
              type: "null"
            valorMomentoUtc:
              type: "null"
        - title: Valor JSON
          required:
            - tipoDato
            - valorJson
          properties:
            tipoDato:
              const: json
            valorNumero:
              type: "null"
            valorBooleano:
              type: "null"
            valorTexto:
              type: "null"
            valorEstado:
              type: "null"
            valorJson:
              type: object
            valorDuracion:
              type: "null"
            valorMomentoUtc:
              type: "null"
        - title: Valor de duración
          required:
            - tipoDato
            - valorDuracion
          properties:
            tipoDato:
              const: duracion
            unidad:
              enum:
                - null
                - ""
                - s
            valorNumero:
              type: "null"
            valorBooleano:
              type: "null"
            valorTexto:
              type: "null"
            valorEstado:
              type: "null"
            valorJson:
              type: "null"
            valorDuracion:
              type: number
              minimum: 0
              maximum: 1.7976931348623157e+308
              multipleOf: 0.0001
            valorMomentoUtc:
              type: "null"
        - title: Valor de momento UTC
          required:
            - tipoDato
            - valorMomentoUtc
          properties:
            tipoDato:
              const: momento_utc
            unidad:
              enum:
                - null
                - ""
            valorNumero:
              type: "null"
            valorBooleano:
              type: "null"
            valorTexto:
              type: "null"
            valorEstado:
              type: "null"
            valorJson:
              type: "null"
            valorDuracion:
              type: "null"
            valorMomentoUtc:
              type: string
              format: date-time
              pattern: "^[1-9][0-9]{3}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
      properties:
        categoria:
          type: string
          minLength: 1
          maxLength: 64
        clave:
          type: string
          minLength: 1
          maxLength: 128
        tag:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 128
        tipoDato:
          $ref: "#/components/schemas/TelemetryDataType"
        unidad:
          type:
            - string
            - "null"
          maxLength: 32
          description: >
            Identificador declarado de unidad. No existe conversión automática
            entre unidades. Una unidad incompatible con la identidad ya
            consolidada de la señal provoca el rechazo de esa observación.
        observadoEnUtc:
          type: string
          format: date-time
          description: Momento UTC al que pertenece la observación.
        valorNumero:
          type:
            - number
            - "null"
          description: Valor para observaciones numéricas.
        valorBooleano:
          type:
            - boolean
            - "null"
          description: Valor para observaciones booleanas.
        valorTexto:
          type:
            - string
            - "null"
          maxLength: 2048
          description: Valor para observaciones textuales.
        valorEstado:
          type:
            - string
            - "null"
          maxLength: 128
          description: Estado discreto declarado por el agente.
        valorJson:
          type:
            - object
            - "null"
          description: Valor estructurado. Su representación estable serializada queda limitada a 2048 caracteres.
        valorDuracion:
          type:
            - number
            - "null"
          minimum: 0
          maximum: 1.7976931348623157e+308
          description: >
            Duración no negativa expresada en segundos, con un máximo de cuatro
            cifras decimales. El servidor valida la precisión sobre el valor JSON.
        valorMomentoUtc:
          type:
            - string
            - "null"
          format: date-time
          pattern: "^[1-9][0-9]{3}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
          description: Instante UTC estricto, sin fracciones y con precisión de segundo.
        calidad:
          $ref: "#/components/schemas/TelemetryQuality"
        severidadDeclarada:
          $ref: "#/components/schemas/TelemetryDeclaredSeverity"
        origen:
          $ref: "#/components/schemas/TelemetryOrigin"
        vigenteHastaUtc:
          type:
            - string
            - "null"
          format: date-time
          description: Caducidad opcional de la observación cuando el agente declara vigencia temporal.
        detalleHumano:
          type:
            - string
            - "null"
          maxLength: 512
          description: Nota operativa para ayudar a interpretar la observación.
        metadatos:
          type:
            - object
            - "null"
          description: JSON auxiliar. Su representación estable serializada queda limitada a 2048 caracteres.
        definicionSenal:
          $ref: "#/components/schemas/TelemetrySignalDefinition"
    TelemetryIngestionResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - resultado
        - requestId
        - telemetriaRequestId
        - serverTimeUtc
        - recibidoEnUtc
        - aceptadas
        - rechazadas
        - errores
      description: >
        Resultado contractual e inmediato de una ingesta de telemetría. Describe
        qué observaciones se han aceptado o rechazado, pero no expone el
        procesamiento asíncrono posterior ni el estado de reglas de
        interpretación, monitores, alertas o automatizaciones.
      properties:
        ok:
          type: boolean
          description: Indica si el lote completo quedó aceptado sin rechazos.
        resultado:
          $ref: "#/components/schemas/TelemetryIngestionStatus"
        requestId:
          type: string
          description: Correlación nueva generada por Sentinelia para este intento HTTP.
        telemetriaRequestId:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
          description: Identidad durable del lote que el servidor confirma o reproduce.
        serverTimeUtc:
          type: string
          format: date-time
        recibidoEnUtc:
          type: string
          format: date-time
          description: Hora UTC generada por Sentinelia al recibir el lote.
        aceptadas:
          type: integer
          minimum: 0
          description: >
            Número de observaciones admitidas por la ingesta. No equivale al
            número de evaluaciones, coincidencias, cambios de estado o alertas.
        rechazadas:
          type: integer
          minimum: 0
          description: Número de observaciones rechazadas durante la validación o persistencia.
        errores:
          type: array
          items:
            $ref: "#/components/schemas/TelemetryObservationError"
        coordinacion:
          $ref: "#/components/schemas/AgentHeartbeatCoordination"
    TelemetryObservationError:
      type: object
      additionalProperties: false
      required:
        - indice
        - code
        - message
      properties:
        indice:
          type: integer
          minimum: 0
          description: Posición de la observación rechazada dentro del lote.
        code:
          type: string
          maxLength: 80
        message:
          type: string
          maxLength: 255
        campo:
          type:
            - string
            - "null"
          maxLength: 120
    TelemetryDataType:
      type: string
      enum:
        - numero
        - booleano
        - texto
        - estado
        - json
        - duracion
        - momento_utc
    TelemetryQuality:
      type: string
      default: valida
      enum:
        - valida
        - parcial
        - estimada
        - obsoleta
        - error_lectura
        - desconocida
    TelemetryDeclaredSeverity:
      type: string
      default: info
      enum:
        - info
        - aviso
        - critica
        - desconocida
    TelemetryOrigin:
      type: string
      default: directa
      enum:
        - directa
        - calculada
        - reenviada
        - manual
        - desconocida
    TelemetryIngestionStatus:
      type: string
      enum:
        - aceptado
        - parcial
        - rechazado
    EstadoAdministrativoAgente:
      type: string
      enum:
        - activo
        - deshabilitado
    EstadoAccesoAgente:
      type: string
      enum:
        - normal
        - cuarentena
    EstadoVidaPolAgente:
      type: string
      enum:
        - nunca_conectado
        - vivo
        - silencioso
        - inconsistente_relogin_requerido
    Guid:
      type: string
      format: uuid
    SessionRequestId:
      type: string
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
      description: >
        UUIDv7 estable generado por el agente para una operación concreta de
        login o refresh. No es un token, no autoriza por sí mismo y solo sirve
        para idempotencia, replay de respuesta y trazabilidad técnica.
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - requestId
        - code
        - message
      properties:
        ok:
          const: false
        requestId:
          type: string
        code:
          type: string
        message:
          type: string
        action:
          type:
            - string
            - "null"
          enum:
            - continue
            - login_required
            - login_again
            - null
        cuarentenaHastaUtc:
          type:
            - string
            - "null"
          format: date-time
        validation:
          type: array
          items:
            $ref: "#/components/schemas/ValidationErrorDetail"
        currentVersion:
          $ref: "#/components/schemas/DdnsDecimalUint64"
    ValidationErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          required:
            - validation
    ValidationErrorDetail:
      type: object
      additionalProperties: false
      required:
        - field
        - message
      properties:
        field:
          type: string
        message:
          type: string
