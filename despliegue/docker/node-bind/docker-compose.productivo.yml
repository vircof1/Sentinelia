services:
  app:
    build:
      context: ../../..
      dockerfile: despliegue/docker/node-bind/Dockerfile
    image: sentinelia-node-bind:5.21
    container_name: sentinelia-app
    env_file:
      - ${SENTINELIA_ENV_FILE:-../../../.env}
    environment:
      NODE_ENV: production
      AGENTES_ELIMINACION_ADMINISTRATIVA_HTTP_HABILITADA: ${AGENTES_ELIMINACION_ADMINISTRATIVA_HTTP_HABILITADA:-true}
      AGENTES_DDNS_HABILITADO: ${AGENTES_DDNS_HABILITADO:-true}
      SQL_HOST: mariadb
      SQL_PUERTO: 3306
      REDIS_URL: redis://redis:6379
      PUERTO_WEB: 3000
      DNS_ACTIVO: ${DNS_ACTIVO:-false}
      BIND_RAIZ_ARTEFACTOS: /var/lib/sentinelia/bind/artefactos
      BIND_PUBLICADOR_COORDINADO_ACTIVO: "true"
      BIND_SELECTOR_ACTIVO: /etc/bind/sentinelia-selector.conf
      BIND_LOCK_FILE: /var/lib/sentinelia/bind/publicacion.lock
      BIND_NAMED_CONF_ACTIVO: /etc/bind/sentinelia-root.conf
      BIND_NAMED_EXECUTABLE: /usr/sbin/named
      BIND_NAMED_ARGUMENTOS_JSON: "[]"
      BIND_RNDC_EXECUTABLE: /usr/sbin/rndc
      BIND_RNDC_ARGUMENTOS_JSON: '["-s","127.0.0.1","-p","953","-k","/run/named/sentinelia-rndc.key"]'
      BIND_CHECKCONF_EXECUTABLE: /usr/bin/named-checkconf
      BIND_CHECKZONE_EXECUTABLE: /usr/bin/named-checkzone
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PUERTO_PUBLICADO:-3001}:3000/tcp"
      - "${DNS_BIND_ADDRESS:-0.0.0.0}:${DNS_PUERTO_PUBLICADO:-53}:53/udp"
      - "${DNS_BIND_ADDRESS:-0.0.0.0}:${DNS_PUERTO_PUBLICADO:-53}:53/tcp"
    volumes:
      - bind_artifacts:/var/lib/sentinelia/bind
      - bind_config:/etc/bind
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 20s
  mariadb:
    image: mariadb:11
    container_name: sentinelia-mariadb
    env_file:
      - ${SENTINELIA_ENV_FILE:-../../../.env}
    environment:
      MARIADB_ROOT_PASSWORD: ${SQL_PASSWORD}
      MARIADB_DATABASE: ${SQL_BASE_DATOS}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p\"$${MARIADB_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sentinelia-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  bind_artifacts:
  bind_config:
  mariadb_data:
  redis_data:
